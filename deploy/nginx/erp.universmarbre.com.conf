# Install this on the public reverse proxy. Certificates are provisioned by
# your ACME client or hosting platform at the paths below.
server {
    listen 80;
    listen [::]:80;
    server_name erp.universmarbre.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.universmarbre.com;

    ssl_certificate /etc/letsencrypt/live/erp.universmarbre.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.universmarbre.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 22m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
