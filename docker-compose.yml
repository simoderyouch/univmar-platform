services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-univmar}
      POSTGRES_USER: ${POSTGRES_USER:-univmar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-univmar_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-univmar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-univmar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-univmar_local_password}
      UNIVMAR_JWT_SECRET: ${UNIVMAR_JWT_SECRET:-local-development-secret-change-before-production-2026}
      UNIVMAR_INITIAL_ADMIN_EMAIL: ${UNIVMAR_INITIAL_ADMIN_EMAIL:-admin@univmar.local}
      UNIVMAR_INITIAL_ADMIN_PASSWORD: ${UNIVMAR_INITIAL_ADMIN_PASSWORD:-ChangeMe123!}
      UNIVMAR_CORS_ALLOWED_ORIGINS: ${UNIVMAR_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UNIVMAR_STORAGE_PROVIDER: ${UNIVMAR_STORAGE_PROVIDER:-s3}
      UNIVMAR_STORAGE_S3_ENDPOINT: ${UNIVMAR_STORAGE_S3_ENDPOINT:-http://minio:9000}
      UNIVMAR_STORAGE_S3_PUBLIC_URL: ${UNIVMAR_STORAGE_S3_PUBLIC_URL:-http://localhost:9000/univmar}
      UNIVMAR_STORAGE_S3_BUCKET: ${UNIVMAR_STORAGE_S3_BUCKET:-univmar}
      UNIVMAR_STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      UNIVMAR_STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      UNIVMAR_BASE_GALLERY_SOURCE: ${UNIVMAR_BASE_GALLERY_SOURCE:-/app/base-gallery}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./base-gallery:/app/base-gallery:ro

  web:
    build:
      context: ./frontend
      args:
        VITE_ASSET_BASE_URL: ${VITE_ASSET_BASE_URL:-http://localhost:9000/univmar}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
