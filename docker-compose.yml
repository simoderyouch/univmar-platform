services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: univmar
      POSTGRES_USER: univmar
      POSTGRES_PASSWORD: univmar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univmar -d univmar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/univmar
      SPRING_DATASOURCE_USERNAME: univmar
      SPRING_DATASOURCE_PASSWORD: univmar
      UNIVMAR_STORAGE_ROOT: /app/data/uploads
      UNIVMAR_PUBLIC_API_URL: http://localhost:8080/api/v1
      UNIVMAR_INITIAL_ADMIN_EMAIL: ${UNIVMAR_INITIAL_ADMIN_EMAIL:-}
      UNIVMAR_INITIAL_ADMIN_PASSWORD: ${UNIVMAR_INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - platform_media:/app/data/uploads
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
  landing:
    build: ./landing
    environment:
      UNIVMAR_API_URL: http://api:8080/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # Private local media is mounted only when the site runs. It is neither
      # committed to Git nor copied into the public landing image.
      - ./landing/private-assets:/app/public:ro
    depends_on:
      - api
volumes:
  postgres_data:
  platform_media:
